<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        const errDiv = document.createElement('div');
        errDiv.style = "color: red; padding: 20px; font-family: monospace; font-size: 16px; background: #fee; border: 1px solid red; position: fixed; top: 0; left: 0; width: 100%; z-index: 999999;";
        errDiv.innerText = "RUNTIME ERROR: " + message + "\n" + source + ":" + lineno + ":" + colno + "\n" + (error ? error.stack : '');
        document.body.appendChild(errDiv);
      };
      window.onunhandledrejection = function(event) {
        const errDiv = document.createElement('div');
        errDiv.style = "color: red; padding: 20px; font-family: monospace; font-size: 16px; background: #fee; border: 1px solid red; position: fixed; top: 0; left: 0; width: 100%; z-index: 999999;";
        errDiv.innerText = "PROMISE ERROR: " + (event.reason ? event.reason.toString() : 'Unknown') + "\n" + (event.reason && event.reason.stack ? event.reason.stack : '');
        document.body.appendChild(errDiv);
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
